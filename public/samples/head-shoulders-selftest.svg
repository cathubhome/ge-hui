  <text x="48" y="190" font-family="Microsoft YaHei, Arial" font-size="15"><tspan x="48" dy="0">Head, shoulders, knees and toes</tspan><tspan x="48" dy="22">And eyes and ears and mouth and nose</tspan><tspan x="48" dy="22">头，肩膀，膝盖，脚趾</tspan><tspan x="48" dy="22">眼睛，耳朵，嘴巴，鼻子</tspan></text>
  <text x="48" y="410" font-family="Microsoft YaHei, Arial" font-size="14">边唱边指一指，摸一摸！</text>
  
